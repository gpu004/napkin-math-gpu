name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-dev --locked prek run --all-files --show-diff-on-failure

  # The commit-msg hook only runs for local `git commit`; jj commits and the
  # GitHub merge button skip it. Squash merges take the PR title as the
  # commit subject, so the title is checked too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail=0
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/msg"
          sh scripts/commit-msg.sh "$RUNNER_TEMP/msg" || fail=1
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            sh scripts/commit-msg.sh "$RUNNER_TEMP/msg" || fail=1
          done
          exit "$fail"
