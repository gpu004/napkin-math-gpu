[project]
name = "napkin-math-gpu"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["prek==0.5.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "I", "B023", "UP017", "ISC", "RUF059"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false
